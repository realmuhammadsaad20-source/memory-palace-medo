name: Build Android APK - ميموري بالاس ميدو

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Scaffolding
        run: |
          rm -rf android
          flutter create --org com.medo memory_palace_medo
          cp -r memory_palace_medo/android .
          rm -rf memory_palace_medo
          python3 scripts/setup_android.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memory-Palace-Medo-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
